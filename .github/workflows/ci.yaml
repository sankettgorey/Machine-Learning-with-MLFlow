name: sample ci workflow


on:
    pull: 
        branches:
            - main
    pull_request: 
        branches:
            - main


jobs:

    test:
        runs-on: ubuntu-latest


    steps:
        - name: checkout code
          uses: actions/checkout@v2

        - name: Pull Python code
          uses: actions/checkout@v2

        - name: install Python
          uses: actions/setup@v2
          with:
                python-version: "3.13"
        
        - name: install dependencies
          run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

        - name: run tests
          run: |
          python _test.py