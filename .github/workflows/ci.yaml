name: sample ci workflow


on:
    push: 
        branches:
            - main
    pull_request: 
        branches:
            - main


jobs:

    test:
        runs-on: ubuntu-latest


        steps:
            - name: checkout code
              uses: actions/checkout@v2

            - name: install Python
              uses: actions/setup-python@v4
              with:
                    python-version: "3.13"
            
            - name: install dependencies
              run: |
                pip install -r requirements.txt

            - name: run tests
              run: |
                python _test.py